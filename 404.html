<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Focus Lost</title>
<style> *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0e0f1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.header{width:100%;max-width:420px;background:#1a1d2f;border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border:1px solid #2a2d45}
.card{width:100%;max-width:420px;background:#1a1d2f;border-radius:28px;border:1px solid #2a2d45;margin-top:18px;padding:28px 20px;text-align:center}
.ring{width:220px;height:220px;border-radius:50%;margin:0 auto;border:10px solid #2a2d45;display:grid;place-items:center}
.ring h1{font-size:68px} .ring p{color:#8b5cf6;margin-top:6px}
.btn{border:none;border-radius:999px;padding:12px 20px;font-weight:600;text-decoration:none;display:inline-flex}
.primary{background:#8b5cf6;color:#fff} .secondary{background:#23263f;color:#d1d5db;border:1px solid #2a2d45}
</style>
</head>
<body>
<div class="header"><b>Focus<span style="color:#8b5cf6">Flow</span></b><small>small steps. Big progress.</small></div>
<div class="card">
  <div class="ring"><div><h1>404</h1><p>Focus Lost</p></div></div>
  <h3 style="margin-top:20px">Oops you wandered off!</h3>
  <p style="color:#9ca3af;font-size:13px;margin-top:6px">This page doesn't exist.</p>
  <div style="margin-top:18px;display:flex;gap:10px;justify-content:center">
    <a class="btn secondary" href="javascript:history.back()">Go Back</a>
    <a class="btn primary" href="./">Go Home</a>
  </div>
</div>
</body>
</html>
